name: Deploy browser calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload static calculator
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed HTML and JavaScript
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$SITE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$SITE_URL" --output /tmp/fetal-biometry-index.html
          grep -Fq 'Fetal ultrasound biometry' /tmp/fetal-biometry-index.html
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/biometry.js" --output /tmp/fetal-biometry-js.js
          grep -Fq 'estimateFetalWeight' /tmp/fetal-biometry-js.js
