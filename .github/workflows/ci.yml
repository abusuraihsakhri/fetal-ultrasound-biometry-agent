name: Tests and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check dependency installation
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents fetal_echo_ai tests biometry.py cli.py enrichment.py simulator.py
      - name: Run Python test suite
        run: python -m pytest -q

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check browser JavaScript syntax
        run: node --check web/biometry.js
      - name: Test Hadlock-3 browser implementation
        run: node --test web/biometry.test.js
