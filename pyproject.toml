[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fetal-ultrasound-biometry-engine"
version = "2.0.0"
description = "FetalEcho-AI: Ultrasound Biometry & Gestational Age Estimation Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fetal-ultrasound-biometry-engine = "fetal_echo_ai.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fetal-ultrasound-biometry-engine"
Repository = "https://github.com/abusuraihsakhri/fetal-ultrasound-biometry-engine.git"
