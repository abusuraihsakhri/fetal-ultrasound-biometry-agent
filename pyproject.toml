[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fetal-ultrasound-biometry-agent"
version = "3.0.0"
description = "Fetal Ultrasound Biometry Agent: Clinical decision support system for fetal ultrasound measurements"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
fetal-ultrasound-biometry-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/fetal-ultrasound-biometry-agent"
Repository = "https://github.com/abusuraihsakhri/fetal-ultrasound-biometry-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test"]
python_functions = ["test_*"]

[tool.setuptools]
py-modules = ["biometry", "cli", "enrichment", "simulator", "fetal_echo_ai_app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents", "agents.*", "fetal_echo_ai", "fetal_echo_ai.*"]
